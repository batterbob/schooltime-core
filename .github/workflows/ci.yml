name: ci
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix: {python-version: ['3.11', '3.12']}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: ${{ matrix.python-version }}}
      - run: python -m pip install '.[dev]'
      - run: python -m pytest
      - run: ruff check src tests
      - run: mypy src
      - run: python -m build
      - run: python -m pip install --target /tmp/wheel dist/*.whl && PYTHONPATH=/tmp/wheel python -c 'import schooltime_core'
      - run: python tools/check_release_tree.py --generic
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Scan all reachable history with Gitleaks 8.30.1
        run: >-
          docker run --rm
          -v "$PWD:/repo:ro"
          ghcr.io/gitleaks/gitleaks@sha256:b109bc5f8f76a38196a3e413704fc5b9e3c32360bce4e4b603bd6f45b3721dbb
          git --no-banner --no-color --redact=100 /repo
